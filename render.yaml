services:
  - type: redis
    name: queueflow-redis
    ipAllowList: []
    plan: free

  - type: web
    name: queueflow-api
    env: docker
    dockerfilePath: docker/Dockerfile.api
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: queueflow-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: queueflow-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: queueflow-worker
    env: docker
    dockerfilePath: docker/Dockerfile.worker
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: queueflow-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: queueflow-redis
          property: connectionString

  - type: web
    name: queueflow-web
    env: docker
    dockerfilePath: docker/Dockerfile.web
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: queueflow-api
          property: host

databases:
  - name: queueflow-postgres
    databaseName: queueflow
    plan: free
